<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页录屏工具</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎥 网页录屏工具</h1>
            <p class="desc">点击按钮开始录制您的屏幕内容</p>
            <button id="mainStartBtn" class="main-btn">开始录制</button>
            <div id="statusText" class="status-text"></div>
        </div>
    </div>
    <!-- 悬浮控制条（默认隐藏） -->
    <div id="floatBar" class="float-bar">
        <button id="micBtn" class="circle-btn red" title="麦克风开关">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="white">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z" />
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
            </svg>
        </button>
        <button id="recCtrlBtn" class="rec-btn green">开始录制</button>
        <button id="closeFloatBtn" class="close-btn" title="关闭">✕</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
